<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Smash-it!</title>
</head>
<body>
    <header>
        <div id="infobar">
            <div id="menu-score">
                <h2>
                    <span class="indicators">Score:</span> <div id="score">0</div> 
                </h2>
            </div>
            <div id="menu-time">
                <h2>
                    <span class="indicators">Time left</span> <div id="time">60</div>
                </h2>
            </div>
            <div id="menu-lives">
                <img src="./assets/images/icons/vecteezy_game-heart-pixelated_54978926.png" alt="lives left icon"> <div id="lives-left">3</div>
            </div>
        </div>
        <div id="level">
            <input type="radio" id="easy" name="level" value="easy" checked>
            <label for="easy">Easy</label>
            <input type="radio" id="medium" name="level" value="medium">
            <label for="medium">Medium</label>
            <input type="radio" id="hard" name="level" value="hard">
            <label for="hard">Hard</label>
        </div>
    </header>
    <main>
        <div id="panel">
            <div class="panel-row">
                <div class="box" id="1"></div>
                <div class="box" id="2"></div>
                <div class="box" id="3"></div>
            </div>
            <div class="panel-row">
                <div class="box" id="4"></div>
                <div class="box" id="5"></div>
                <div class="box" id="6"></div>
            </div>
            <div class="panel-row">
                <div class="box" id="7"></div>
                <div class="box" id="8"></div>
                <div class="box" id="9"></div>
            </div>
        </div>
        <div id="position-start">
            <div id="start">
                <button class="action-button" id="start-button">START GAME</button>
            </div>
        </div>
        <div class="hidden" id="position-gameover">
            <div id="gameover">
                <h2>GAME OVER</h2>
                <h3>Score: <span id="final-score">0</span></h3>
                <button class="action-button" id="restart-button">RESTART</button>
            </div>
        </div>
    </main>
    <footer>
        <h2>made by <a href="https://github.com/kevinsoarespaiva" target="_blank">Kevin Soares</a></h2>
        <p>
            <a href="https://www.vecteezy.com/free-png/8bit" target="_blank">8bit PNGs by Vecteezy</a>
        </p>
    </footer>
    <script defer src="./assets/scripts/engine.js"></script>
</body>
</html>
