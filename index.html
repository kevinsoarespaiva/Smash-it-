<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Smash-it!</title>
</head>
<body>
    <header>
        <div id="infobar">
            <div id="menu-score">
                <h2>
                    <span class="indicators">Score:</span> <div id="score">0</div> 
                </h2>
            </div>
            <div id="menu-time">
                <h2>
                    <span class="indicators">Time left</span> <div id="time">0</div>
                </h2>
            </div>
            <div id="menu-lives">
                <img src="./assets/images/icons/vecteezy_game-heart-pixelated_54978926.png" alt="lives left icon"> <div id="lives-left">3</div>
            </div>
        </div>
    </header>
    <main>
        <div id="panel">
            <div class="panel-row">
                <div class="box enemy" id="box-1"></div>
                <div class="box enemy-hit" id="box-2"></div>
                <div class="box" id="box-3"></div>
            </div>
            <div class="panel-row">
                <div class="box" id="box-4"></div>
                <div class="box" id="box-5"></div>
                <div class="box" id="box-6"></div>
            </div>
            <div class="panel-row">
                <div class="box" id="box-7"></div>
                <div class="box" id="box-8"></div>
                <div class="box" id="box-9"></div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
    <script defer src="./assets/scripts/engine.js"></script>
</body>
</html>
